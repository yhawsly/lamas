<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Shield Outline Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <!-- Stylized L Gradient -->
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    
    <!-- Drop Shadow Filter for Premium Feel -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Maskable Area Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shield Core Shape -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Frame -->
    <path d="M256 64 C350 64 390 100 390 100 C390 100 390 280 256 420 C122 280 122 100 122 100 C122 100 162 64 256 64 Z" 
          fill="url(#glowGrad)" 
          stroke="url(#shieldGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Inner Shield Accent -->
    <path d="M256 88 C330 88 362 116 362 116 C362 116 362 260 256 380 C150 260 150 116 150 116 C150 116 182 88 256 88 Z" 
          fill="none" 
          stroke="#3b82f6" 
          stroke-width="2" 
          stroke-opacity="0.4" />

    <!-- stylized Academic Cap inside Shield top -->
    <path d="M256 128 L320 160 L256 192 L192 160 Z" fill="#3b82f6" opacity="0.8" />
    <path d="M208 174 L208 210 C208 220 230 226 256 226 C282 226 304 220 304 210 L304 174" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.8" />
    <path d="M320 160 L320 200 L324 200 L324 160 Z" fill="#3b82f6" opacity="0.8" />

    <!-- Stylized Modern 'L' (Lecturer / Learning) -->
    <path d="M220 200 
             C220 190 230 190 230 200 
             L230 290 
             C230 310 245 320 270 320 
             L310 320 
             C320 320 320 335 310 335 
             L260 335 
             C230 335 220 320 220 290 
             Z" 
          fill="url(#lGrad)" />
  </g>
</svg>
